<h2>Book Management System</h2>
<a href="{% url 'book_create' %}">Add New Book</a>
<table border="1" cellpadding="8">
  <tr><th>ID</th><th>Title</th><th>Author</th><th>Price (₹)</th><th>Actions</th></tr>
  {% for b in books %}
  <tr>
    <td>{{ b.id }}</td><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.price }}</td>
    <td>
      <a href="{% url 'book_update' b.id %}">Edit</a> |
      <a href="{% url 'book_delete' b.id %}">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>
